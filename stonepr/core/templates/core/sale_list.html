<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>لیست فروش‌ها</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>لیست فروش‌ها</h2>

    <a href="{% url 'add_sale' %}" class="btn btn-primary mb-3">
        ایجاد فروش جدید
    </a>

    <table class="table table-bordered">

        <tr>
            <th>شناسه</th>
            <th>مشتری</th>
            <th>کارمند</th>
            <th>تاریخ</th>
            <th>آیتم‌ها</th>
        </tr>

        {% for s in sales %}

        <tr>
            <td>{{ s.id }}</td>
            <td>{{ s.customer }}</td>
            <td>{{ s.employee }}</td>
            <td>{{ s.date }}</td>

            <td>
                <a href="{% url 'add_sale_item' s.id %}" class="btn btn-success btn-sm">
                    افزودن آیتم
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
