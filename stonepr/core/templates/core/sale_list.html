<!-- sale_list.html -->
{% extends 'core/base.html' %}

{% block title %}فروش‌ها{% endblock %}

{% block content %}

<div class="d-flex justify-content-between mb-3">

    <h3>فاکتورهای فروش</h3>

    <a href="{% url 'add_sale' %}" class="btn btn-primary">
        ثبت فروش
    </a>

</div>

<table class="table table-bordered">

    <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>مشتری</th>
            <th>تاریخ</th>
            <th>مبلغ کل</th>
        </tr>

    </thead>

    <tbody>

        {% for sale in sales %}

        <tr>

            <td>{{ sale.id }}</td>

            <td>{{ sale.customer }}</td>

            <td>{{ sale.sale_date }}</td>

            <td>{{ sale.total_amount }}</td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
