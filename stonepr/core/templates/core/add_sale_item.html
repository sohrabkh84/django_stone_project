<form method="POST">
    {% csrf_token %}

    <label>سنگ:</label>
    <select name="stone">
        {% for stone in stones %}
            <option value="{{ stone.id }}">
                {{ stone.name }}
            </option>
        {% endfor %}
    </select>

    <br>

    <label>تعداد:</label>
    <input type="number" name="quantity">

    <br>

    <button type="submit">
        ثبت آیتم فروش
    </button>
</form>
