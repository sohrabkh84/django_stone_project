<!DOCTYPE html>
<html lang="fa">

<head>

    <meta charset="UTF-8">

    <title>اشخاص</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>لیست اشخاص</h2>

<a href="{% url 'add_person' %}" class="btn btn-primary mb-3">

    افزودن شخص

</a>

<table class="table table-bordered">

    <tr>

        <th>نام</th>
        <th>نام خانوادگی</th>
        <th>تلفن</th>
        <th>عملیات</th>

    </tr>

    {% for person in persons %}

    <tr>

        <td>{{ person.first_name }}</td>

        <td>{{ person.last_name }}</td>

        <td>{{ person.phone }}</td>

        <td>

            <a href="{% url 'edit_person' person.id %}" class="btn btn-warning btn-sm">

                ویرایش

            </a>

            <a href="{% url 'delete_person' person.id %}" class="btn btn-danger btn-sm">

                حذف

            </a>

        </td>

    </tr>

    {% endfor %}

</table>

</body>

</html>
