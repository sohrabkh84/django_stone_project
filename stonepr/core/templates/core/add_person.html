<!-- add_person.html -->
{% extends 'core/base.html' %}

{% block title %}افزودن شخص{% endblock %}

{% block content %}

<div class="card shadow-sm border-0">

    <div class="card-body">

        <h3 class="mb-4">
            افزودن شخص جدید
        </h3>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-success">
                ثبت شخص
            </button>

        </form>

    </div>

</div>

{% endblock %}
