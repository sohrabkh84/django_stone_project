<!-- add_supplier.html -->
{% extends 'core/base.html' %}

{% block title %}افزودن تامین‌کننده{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="card border-0 shadow-lg">

            <div class="card-body">

                <div class="text-center mb-4">

                    <i class="bi bi-truck display-3 text-warning"></i>

                    <h2 class="fw-bold mt-3">
                        افزودن تامین‌کننده جدید
                    </h2>

                    <p class="text-muted">
                        اطلاعات تامین‌کننده را وارد کنید
                    </p>

                </div>

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            شخص
                        </label>

                        {{ form.person }}

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            نام شرکت
                        </label>

                        {{ form.company_name }}

                    </div>

                    <div class="d-grid">

                        <button type="submit" class="btn btn-warning btn-lg">

                            <i class="bi bi-check-circle"></i>

                            ثبت تامین‌کننده

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
