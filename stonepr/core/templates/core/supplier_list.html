<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>تامین کنندگان</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2>لیست تامین کنندگان</h2>

<a href="{% url 'add_supplier' %}" class="btn btn-primary mb-3">

    افزودن تامین کننده

</a>

<table class="table table-bordered">

    <tr>
        <th>نام شرکت</th>
        <th>شخص</th>
        <th>عملیات</th>
    </tr>

    {% for supplier in suppliers %}

    <tr>

        <td>{{ supplier.company_name }}</td>

        <td>{{ supplier.person }}</td>

        <td>

            <a href="{% url 'edit_supplier' supplier.id %}" class="btn btn-warning btn-sm">

                ویرایش

            </a>

            <a href="{% url 'delete_supplier' supplier.id %}" class="btn btn-danger btn-sm">

                حذف

            </a>

        </td>

    </tr>

    {% endfor %}

</table>

</body>
</html>
