<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>لیست خریدها</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h2>لیست خریدها</h2>

    <a href="{% url 'add_purchase' %}" class="btn btn-primary mb-3">
        ایجاد خرید جدید
    </a>

    <table class="table table-bordered">

        <tr>
            <th>شناسه</th>
            <th>تامین‌کننده</th>
            <th>کارمند</th>
            <th>تاریخ</th>
            <th>آیتم‌ها</th>
        </tr>

        {% for p in purchases %}

        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.supplier }}</td>
            <td>{{ p.employee }}</td>
            <td>{{ p.date }}</td>

            <td>
                <a href="{% url 'add_purchase_item' p.id %}" class="btn btn-success btn-sm">
                    افزودن آیتم
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
