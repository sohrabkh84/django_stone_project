<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <title>مشتریان</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

    <h1>لیست مشتری‌ها</h1>

    <a href="{% url 'add_customer' %}" class="btn btn-primary mb-3">
        افزودن مشتری
    </a>

    <table class="table table-bordered">

        <tr>
            <th>نام</th>
            <th>نام خانوادگی</th>
            <th>کد مشتری</th>
            <th>عملیات</th>
        </tr>

        {% for customer in customers %}

        <tr>
            <td>{{ customer.person.first_name }}</td>
            <td>{{ customer.person.last_name }}</td>
            <td>{{ customer.customer_code }}</td>

            <td>
                <a href="{% url 'edit_customer' customer.id %}" class="btn btn-warning btn-sm">
                    ویرایش
                </a>

                <a href="{% url 'delete_customer' customer.id %}" class="btn btn-danger btn-sm">
                    حذف
                </a>
            </td>
        </tr>

        {% endfor %}

    </table>

</body>
</html>
